packages:
  - 'packages/*'
  - 'examples/*'
  - 'krantho-site'

# Approve build scripts for trusted native modules so pnpm runs their install
# step. better-sqlite3's install script is `prebuild-install || node-gyp rebuild`,
# so approving it lets pnpm fetch the matching prebuilt binary (all platforms/ABIs
# published upstream) in ~2s instead of compiling SQLite from source (~90s).
# The others stay off: cpu-features and ssh2's own step are optional accelerators
# with pure JS fallbacks, esbuild finds its binary through its optional dependency,
# and protobufjs's step only prints a notice.
allowBuilds:
  better-sqlite3: true
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false

minimumReleaseAgeExclude:
  - '@adobe/structured-data-validator@1.7.1'
  - '@aws-sdk/client-cloudfront@3.1168.0'
  - '@aws-sdk/client-s3@3.1168.0'
  - '@vercel/cli-config@0.4.0'
  - '@vercel/functions@3.11.2'
  - '@vercel/oidc@4.0.9'

# A patched release of a transitive dependency that its parent's range still allows an
# unpatched version of, within the major the parent uses.
overrides:
  # glob 9 to 14.0.1 (CVE: AbortSignal traversal) and the minimatch they bring; their users take 14's API
  'glob@>=9 <14.0.2': ^14.0.2
  zod: ^4.6.7
