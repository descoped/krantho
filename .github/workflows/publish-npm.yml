name: Publish to npm

# Publishes every workspace package that is not private, at the version of a
# release tag, to npm under the @krantho scope (and create-krantho). pnpm
# replaces each workspace:* dependency with the released version and skips a
# package whose version is already on npm, so a re-run publishes only what is
# missing. Each package gets npm provenance from this job's identity.
#
# Manual for now: run it with dry_run (the default) to see what would be
# published. It needs the NPM_TOKEN secret, an npm automation token with
# publish rights on the @krantho organisation.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vMAJOR.MINOR.PATCH)
        required: true
      dry_run:
        description: Pack and list only; publish nothing
        type: boolean
        default: true

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish packages
    if: github.repository == 'descoped/krantho'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Only a release tag whose versioned files all carry its version is published
      - name: Check the release version
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/release-version.mjs check "$TAG"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # A pre-release goes to the `next` dist-tag, so `npm install` keeps the last release
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          dist_tag=latest
          case "$TAG" in *-*) dist_tag=next ;; esac
          args=(--recursive --access public --no-git-checks --tag "$dist_tag")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          elif [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::the NPM_TOKEN secret is not set"
            exit 1
          fi
          pnpm publish "${args[@]}"
