name: E2E (Browser tests)

# Studio's browser suite (packages/e2e) against every target: each example and
# krantho.com, a job per Playwright project. Each job builds the packages (the
# Studio included) and its target, then runs the suite on the target's production
# server — react-spa on its Vite server, which alone serves its API — with a
# fresh database. The reference target runs every spec, so its specs are split
# over several jobs. The suite drops every krantho, sign-in and language-model
# variable from the environment it starts a target with, so it needs no secrets.
#
# It runs on every pull request that changes code, and on main after each merge: two
# changes that pass alone can fail together, and the merged commit is what ships. It also
# builds every example, so no separate example build runs.
on:
  workflow_dispatch:
  pull_request:
    # Every package: the suite drives the API, persistence, schema and SEO
    # through Studio, so a change in any of them can break it; the root
    # files are what the build runs on
    paths:
      - 'packages/**'
      - 'examples/**'
      - 'krantho-site/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'examples/**'
      - 'krantho-site/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/e2e.yml'

# A newer push to a pull request replaces its running suite; every commit on main
# is run in full.
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.project }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The reference target runs every spec, serially in one server: a third of the
          # spec files in each of three jobs, each with a server and database of its own
          - project: nextjs-shadcn
            target: '@krantho/example-nextjs-shadcn'
            shard: 1/3
          - project: nextjs-shadcn
            target: '@krantho/example-nextjs-shadcn'
            shard: 2/3
          - project: nextjs-shadcn
            target: '@krantho/example-nextjs-shadcn'
            shard: 3/3
          - project: nextjs-mui
            target: '@krantho/example-nextjs-mui'
          - project: sveltekit-tailwind
            target: '@krantho/example-sveltekit'
          - project: sveltekit-shadcn
            target: '@krantho/example-sveltekit-shadcn'
          - project: react-ssr
            target: '@krantho/example-react-ssr'
          - project: react-spa
            target: '@krantho/example-react-spa'
          - project: krantho-site
            target: krantho-site
    env:
      PROJECT: ${{ matrix.project }}
      TARGET: ${{ matrix.target }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
      # native modules (better-sqlite3) are fetched as prebuilt binaries during
      # install (onlyBuiltDependencies allowlist in pnpm-workspace.yaml).
      - run: pnpm install --frozen-lockfile
      # The targets import @krantho/* from the packages' built dist, and every
      # server serves Studio from @krantho/studio's dist.
      - run: pnpm run build
      - name: Build the target
        run: pnpm --filter "$TARGET" run build
      - name: Install Chromium
        run: pnpm --filter @krantho/e2e exec playwright install --with-deps chromium
      # `--project` also limits the servers the suite starts to this target's
      - name: Run the suite
        run: pnpm --filter @krantho/e2e exec playwright test --project "$PROJECT" ${SHARD:+--shard "$SHARD"}
      - name: Upload screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.project }}${{ matrix.shard && format('-{0}', strategy.job-index) || '' }}
          path: |
            packages/e2e/test-results/
            packages/e2e/playwright-report/
          retention-days: 14
