routes:
  - route: '/'
    questions:
      - question: 'What does Acme Consulting do?'
        answer: 'Acme Consulting is a strategy and digital transformation firm that helps mid-market and enterprise organizations navigate change. Services include market strategy, platform modernization, and fractional executive leadership.'
      - question: 'Where is Acme Consulting located?'
        answer: 'Acme Consulting is based at 100 Example Street, Suite 400, in the Financial District of San Francisco, CA.'
      - question: 'How do I book a consultation with Acme Consulting?'
        answer: 'You can book a consultation via phone (+1 555-0100), email (hello@acme-consulting.example.com), or the online booking link at acme-consulting.example.com.'
      - question: 'What industries does Acme Consulting serve?'
        answer: 'Acme Consulting works across technology, finance, and healthcare sectors, serving companies ranging from $5M to $500M in revenue.'
      - question: 'How long has Acme Consulting been in business?'
        answer: 'Acme Consulting was founded in 2010 and has over 15 years of experience helping 200+ organizations navigate critical transitions.'

  - route: '/services'
    questions:
      - question: 'What services does Acme Consulting offer?'
        answer: 'Acme Consulting offers three core services: strategy consulting (market analysis, growth roadmaps), digital transformation (platform modernization, data strategy), and advisory/fractional leadership (interim CTO/COO, board guidance).'
      - question: 'Does Acme Consulting offer fractional CTO services?'
        answer: 'Yes, Acme Consulting offers fractional CTO and COO engagements, typically 2-3 days per week, for organizations that need experienced leadership for a defined period.'
      - question: 'Can Acme Consulting help with cloud migration?'
        answer: 'Yes, digital transformation services include legacy platform migration, cloud migration and infrastructure optimization, and data platform architecture.'
      - question: 'Does Acme Consulting do M&A due diligence?'
        answer: 'Yes, commercial due diligence is part of the strategy consulting practice, helping companies evaluate market opportunities during mergers and acquisitions.'
      - question: 'What size companies does Acme Consulting work with?'
        answer: 'Acme Consulting primarily works with mid-market companies ($5M-$500M revenue) and enterprise organizations navigating growth, digital transformation, or leadership transitions.'

  - route: '/about'
    questions:
      - question: 'Who founded Acme Consulting?'
        answer: 'Acme Consulting was founded in 2010 by former executives from global consulting firms and technology companies.'
      - question: 'What is Acme Consulting''s approach?'
        answer: 'Acme Consulting follows three principles: start with the problem (not the solution), work alongside the client team (not above), and measure what matters with clear success criteria.'
      - question: 'How does Acme Consulting differ from other consulting firms?'
        answer: 'Acme consultants embed with client teams and focus on hands-on execution and knowledge transfer, not slide decks. Every engagement has collaboratively defined success criteria.'
      - question: 'What backgrounds do Acme Consulting team members have?'
        answer: 'The team includes former executives, product leaders, and engineers from global consultancies, technology companies and fast-growing startups, bringing diverse perspectives and a bias toward action.'
      - question: 'Does Acme Consulting offer ongoing support after an engagement ends?'
        answer: 'Acme Consulting builds knowledge transfer into every engagement so client teams can sustain results independently. Follow-on advisory engagements are available when needed.'
